repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: swiftformat
        name: swiftformat
        entry: swiftformat
        language: system
        types_or: [swift]
        require_serial: true

      - id: swift-test-if-present
        name: swift test (if Tests exists)
        entry: sh -c 'if [ -d Tests ]; then swift test; else echo "No Tests directory, skipping tests."; fi'
        language: system
        pass_filenames: false
        require_serial: true
